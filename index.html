<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café da Villa - Pizzaria</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff8f0;color:#222}
header{background:#b91c1c;color:#fff;padding:20px;text-align:center}
header h1{font-size:28px} header p{opacity:.9}
nav{background:#111;color:#fff;display:flex;justify-content:center;gap:15px;padding:12px}
nav a{color:#fff;text-decoration:none;font-weight:bold}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:#fff;border-radius:15px;padding:15px;margin-bottom:15px;box-shadow:0 2px 10px #0001;display:flex;gap:12px;align-items:center}
.card img{width:90px;height:90px;object-fit:cover;border-radius:12px;background:#eee}
.card h3{font-size:18px} .card p{font-size:13px;color:#666}
.price{font-weight:bold;color:#b91c1c;font-size:18px;margin:5px 0}
button{background:#b91c1c;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:bold;cursor:pointer}
button.green{background:#16a34a}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
.cart{position:fixed;bottom:15px;left:15px;right:15px;background:#111;color:#fff;padding:14px;border-radius:15px;display:flex;justify-content:space-between;align-items:center}
.hidden{display:none}
.admin{background:#fff;padding:15px;border-radius:15px;margin-top:15px}
</style>
</head>
<body>
<header><h1>🍕 Café da Villa</h1><p>Pizzaria • Luanda • Entrega Rápida</p></header>
<nav><a href="#" onclick="show('loja')">Loja</a><a href="#" onclick="show('adminLogin')">Admin</a></nav>
<div class="container" id="loja">
<h2 style="margin:10px 0">Nosso Menu</h2>
<div id="produtos"></div>
</div>
<div class="container hidden" id="adminLogin">
<h2>Área Admin</h2><p>Senha: <b>1234</b></p>
<input id="senha" type="password" placeholder="Senha do Admin">
<button onclick="entrar()">Entrar</button>
</div>
<div class="container hidden" id="admin">
<div class="admin">
<h2>Adicionar Pizza / Produto</h2>
<input id="nome" placeholder="Nome ex: Pizza Frango">
<input id="preco" type="number" placeholder="Preço ex: 8000">
<input id="desc" placeholder="Descrição">
<input id="foto" placeholder="Link da foto (opcional)">
<button class="green" onclick="addProduto()">Adicionar Produto</button>
<button onclick="sair()">Sair do Admin</button>
</div>
</div>
<div class="cart"><span id="cartInfo">🛒 Carrinho: 0 itens • 0 Kz</span><button class="green" onclick="finalizar()">Pedir no WhatsApp</button></div>
<script>
let produtos = JSON.parse(localStorage.getItem('villa_produtos') || 'null') || [
{nome:'Pizza Margherita',preco:7500,desc:'Molho de tomate, queijo e manjericão',foto:'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=400'},
{nome:'Pizza Frango',preco:9000,desc:'Frango, queijo, milho e orégano',foto:'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400'},
{nome:'Pizza Calabresa',preco:8500,desc:'Calabresa, cebola e queijo',foto:'https://images.unsplash.com/photo-1628840042765-356cda07504e?w=400'}
];
let carrinho=[];
function render(){
document.getElementById('produtos').innerHTML = produtos.map((p,i)=>`
<div class="card"><img src="${p.foto||'https://via.placeholder.com/90'}"><div style="flex:1"><h3>${p.nome}</h3><p>${p.desc}</p><div class="price">${p.preco} Kz</div><button onclick="addCarrinho(${i})">Adicionar +</button></div></div>`).join('');
}
function addCarrinho(i){carrinho.push(produtos[i]); updateCart();}
function updateCart(){let total=carrinho.reduce((s,p)=>s+p.preco,0); document.getElementById('cartInfo').innerText=`🛒 Carrinho: ${carrinho.length} itens • ${total} Kz`;}
function finalizar(){if(!carrinho.length) return alert('Carrinho vazio'); let msg='Olá Café da Villa! Quero pedir:%0A'; carrinho.forEach(p=>msg+=`- ${p.nome} - ${p.preco} Kz%0A`); let total=carrinho.reduce((s,p)=>s+p.preco,0); msg+=`Total: ${total} Kz`; window.open('https://wa.me/244923000000?text='+msg,'_blank');}
function show(id){['loja','adminLogin','admin'].forEach(x=>document.getElementById(x).classList.add('hidden')); document.getElementById(id).classList.remove('hidden');}
function entrar(){if(document.getElementById('senha').value=='1234'){show('admin')}else alert('Senha errada');}
function sair(){show('loja')}
function addProduto(){let n=document.getElementById('nome').value, pr=parseInt(document.getElementById('preco').value), d=document.getElementById('desc').value, f=document.getElementById('foto').value; if(!n||!pr) return alert('Falta nome e preço'); produtos.push({nome:n,preco:pr,desc:d,foto:f}); localStorage.setItem('villa_produtos',JSON.stringify(produtos)); render(); alert('Adicionado!'); show('loja');}
render();
</script>
</body>
</html>
