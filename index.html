<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Café da Villa</title><style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#fff8f0}
header{background:#1a1a1a;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px;color:#ffcc00}.card{background:#fff;margin:12px;padding:12px;border-radius:12px;box-shadow:0 2px 8px #0001}
button{background:#e63946;color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}
input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px}
.wa{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;text-decoration:none;box-shadow:0 4px 12px #0003;z-index:99}
/* CORRENTE AZUL TRANSPARENTE */
#proc{position:fixed;inset:0;background:rgba(0,120,255,.15);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:999}
.chain{font-size:50px;animation:spin 1s infinite;display:flex;gap:5px}
.chain span{color:rgba(0,140,255,.7);text-shadow:0 0 12px #0090ff}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
#proc p{font-weight:bold;color:#0055aa;background:#fff;padding:8px 14px;border-radius:20px}
</style></head><body>
<header><b id="nomeLoja">🍕 Café da Villa</b><span id="horaLoja">Aberto</span></header>
<div id="proc"><div class="chain"><span>🔗</span><span>🔗</span><span>🔗</span></div><p id="procTxt">A processar...</p></div>
<div style="padding:0 4px"><h3 style="margin:12px">Nosso Menu</h3><div id="menu"></div>
<div class="card"><h3>Teu Pedido</h3><div id="carrinho">Vazio</div>
<input id="nome" placeholder="Teu nome"><input id="tel" placeholder="Teu telefone">
<select id="bairro"><option value="">Escolhe o bairro</option></select>
<select id="pag"><option>Multicaixa Express</option><option>Unitel Money</option><option>PayPay</option><option>Transferência Bancária</option></select>
<p>Taxa: <b id="taxa">0 Kz</b> | Total: <b id="total">0 Kz</b><br>Pagás agora (metade): <b id="metade" style="color:green">0 Kz</b> | Resto na entrega: <b id="resto">0 Kz</b></p>
<label>Comprovativo da metade (foto)</label><input type="file">
<button onclick="fazerPedido()">FAZER PEDIDO</button></div></div>
<a class="wa" id="waBtn" href="https://wa.me/244942788931" target="_blank">💬</a>
<script>
let pizzas=[{n:"Frango",p:9000},{n:"Mista",p:8500},{n:"Quatro Queijos",p:10000},{n:"Vegetariana",p:7500},{n:"Pepperoni",p:9500},{n:"Marisco",p:12000}];
let bairros=JSON.parse(localStorage.getItem("bairros")||'[{"n":"Villa / Viana","t":1000},{"n":"Kilamba","t":2000},{"n":"Cazenga","t":1500}]');
let config=JSON.parse(localStorage.getItem("config")||'{"nome":"🍕 Café da Villa","wa":"244942788931","email":"contato@cafédavilla.com"}');
document.getElementById("nomeLoja").innerText=config.nome;
document.getElementById("waBtn").href="https://wa.me/"+config.wa;
let cart=[];
function render(){
 document.getElementById("menu").innerHTML=pizzas.map((x,i)=>`<div class="card"><b>${x.n}</b> - ${x.p} Kz <button onclick="add(${i})">Adicionar +</button></div>`).join("");
 document.getElementById("bairro").innerHTML='<option value="">Escolhe o bairro</option>'+bairros.map((b,i)=>`<option value="${i}">${b.n} - ${b.t} Kz</option>`).join("");
 let sub=cart.reduce((a,c)=>a+c.p,0); let taxa=bairros[document.getElementById("bairro").value]?.t||0; let tot=sub+taxa;
 document.getElementById("carrinho").innerHTML=cart.length?cart.map(c=>c.n+" - "+c.p+" Kz").join("<br>"):"Vazio";
 document.getElementById("taxa").innerText=taxa+" Kz"; document.getElementById("total").innerText=tot+" Kz";
 document.getElementById("metade").innerText=Math.ceil(tot/2)+" Kz"; document.getElementById("resto").innerText=Math.floor(tot/2)+" Kz";
}
function add(i){cart.push(pizzas[i]);render()}
document.getElementById("bairro").onchange=render;
function mostrarProc(txt){document.getElementById("procTxt").innerText=txt;document.getElementById("proc").style.display="flex"}
function fazerPedido(){
 if(!cart.length) return alert("Escolhe uma pizza!");
 mostrarProc("🔗 A processar o teu pedido...");
 setTimeout(()=>{mostrarProc("🔗 A verificar pagamento...")},1200);
 setTimeout(()=>{
  let pedidos=JSON.parse(localStorage.getItem("pedidos")||"[]");
  pedidos.push({nome:document.getElementById("nome").value||"Cliente",total:document.getElementById("total").innerText,items:cart.map(c=>c.n).join(", "),status:"pendente",data:new Date().toLocaleString()});
  localStorage.setItem("pedidos",JSON.stringify(pedidos));
  document.getElementById("proc").style.display="none"; cart=[]; render(); alert("✅ Pedido enviado! Paga a metade e envia o comprovativo no WhatsApp.");
 },2500);
}
render();
</script></body></html>
